name: Monitor do Diário Oficial de Goiânia

on:
  schedule:
    # Toda segunda-feira às 10:13 de Brasília (13:13 UTC)
    - cron: '13 13 * * 1'

  workflow_dispatch:
    inputs:
      dias:
        description: 'Janela em dias a analisar (vazio = 7)'
      ignorar_historico:
        description: 'Reprocessar edições já lidas (teste, não salva histórico)'
        type: boolean
        default: false

jobs:
  check-site:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Essencial para o bot salvar o ultimo_diario.txt
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pypdf google-generativeai

      - name: Rodar o script de monitoramento
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          MISTRAL_API_KEYS: ${{ secrets.MISTRAL_API_KEYS }}
          DIAS_JANELA: ${{ inputs.dias }}
          IGNORAR_HISTORICO: ${{ inputs.ignorar_historico }}
        run: python monitor_diario.py

      - name: Commitar controle de leitura
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add ultimo_diario.txt
          git diff --staged --quiet || (git commit -m "bot: atualiza controle de leitura do diario" && git push)
